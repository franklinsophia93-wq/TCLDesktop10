name: NegocioFacil Android 0.3 - documentos e anúncios teste
on:
  push:
    branches: [negociofacil-android]
    paths:
      - 'negociofacil/NegocioFacil-src.zip'
      - 'negociofacil/upgrade_v03.py'
      - '.github/workflows/negociofacil-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Obter codigo do projeto
        uses: actions/checkout@v4
      - name: Preparar ambiente
        run: |
          mkdir -p build-src
          unzip -q negociofacil/NegocioFacil-src.zip -d build-src
          test -s build-src/web/app.js
          test -s build-src/android/app/build.gradle
          python3 negociofacil/upgrade_v03.py build-src
          grep -q "versionCode 3" build-src/android/app/build.gradle
          node --check build-src/web/app.js
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar SDK Android preinstalado
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar unico APK
        run: gradle -p build-src/android --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=512m" :app:assembleDebug
      - name: Verificar APK
        shell: bash
        run: |
          set -euo pipefail
          APK=build-src/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -tqq "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -Fq "package: name='br.com.negociofacil.app'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -Fq "versionCode='3'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" NegocioFacil-0.3-teste.apk
          sha256sum NegocioFacil-0.3-teste.apk
          echo 'ATENCAO: ASSINATURA DE DEBUG DO CI. ESTA COMPILACAO PODE NAO ATUALIZAR A VERSAO 0.1 INSTALADA.'
      - name: Enviar APK de teste
        uses: actions/upload-artifact@v4
        with:
          name: NegocioFacil-0.3-APK
          path: NegocioFacil-0.3-teste.apk
          if-no-files-found: error
