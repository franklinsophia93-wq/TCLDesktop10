name: NegocioFacil - APK Android unico (Free Pro Empresarial)
on:
  push:
    branches:
      - negociofacil-android
    paths:
      - negociofacil/source-admin-v0.1.zip.b64
      - .github/workflows/negociofacil-android.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: negociofacil-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Obter codigo Android NegocioFacil
        uses: actions/checkout@v4
      - name: Descompactar o projeto separado do TCL Desktop 10
        run: |
          set -euo pipefail
          mkdir -p negociofacil-src
          base64 -d negociofacil/source-admin-v0.1.zip.b64 > "$RUNNER_TEMP/negociofacil-source.zip"
          unzip -tqq "$RUNNER_TEMP/negociofacil-source.zip"
          unzip -q "$RUNNER_TEMP/negociofacil-source.zip" -d negociofacil-src
          test -s negociofacil-src/web/app.js
          test -s negociofacil-src/android/app/src/main/java/br/com/negociofacil/app/MainActivity.java
          grep -q 'adminState()' negociofacil-src/android/app/src/main/java/br/com/negociofacil/app/MainActivity.java
          grep -q 'setAdminTestPlan' negociofacil-src/android/app/src/main/java/br/com/negociofacil/app/MainActivity.java
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar plataforma Android 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validar JavaScript e recursos
        run: |
          node --check negociofacil-src/web/app.js
          test -s negociofacil-src/web/index.html
          test -s negociofacil-src/web/style.css
          test -s negociofacil-src/web/icon-192.png
      - name: Compilar APK ARM64 e Android 13
        run: gradle -p negociofacil-src/android --no-daemon --max-workers=2 --stacktrace assembleDebug
      - name: Verificar integridade e identidade do APK
        run: |
          set -euo pipefail
          APK=negociofacil-src/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -tqq "$APK"
          unzip -Z1 "$APK" > "$RUNNER_TEMP/entries.txt"
          grep -Fxq 'classes.dex' "$RUNNER_TEMP/entries.txt"
          grep -Fxq 'assets/www/index.html' "$RUNNER_TEMP/entries.txt"
          grep -Fxq 'assets/www/app.js' "$RUNNER_TEMP/entries.txt"
          grep -Fxq 'assets/www/style.css' "$RUNNER_TEMP/entries.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -Fq "package: name='br.com.negociofacil.app'"
          cp "$APK" NegocioFacil-0.1-ADM-teste.apk
          sha256sum NegocioFacil-0.1-ADM-teste.apk
      - name: Arquivar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: NegocioFacil-Android-APK-ADM
          path: NegocioFacil-0.1-ADM-teste.apk
          if-no-files-found: error
      - name: Publicar download direto no GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create negociofacil-0.1-admin-test NegocioFacil-0.1-ADM-teste.apk \
            --repo "$GITHUB_REPOSITORY" --target negociofacil-android \
            --title "NegócioFácil 0.1 - Teste Android e conta ADM" \
            --notes "APK Android de TESTE (não comercial). Um único app: Gratuito claro, Pro e Empresarial escuros. Conta ADM local: em Mais > Administração, criar senha na primeira abertura e login com usuário admin; alternar os planos na mesma conta. Clientes, agenda, catálogo, vendas, despesas, orçamentos de texto e backup locais. Funções avançadas, AdMob, assinaturas, cobrança e login em nuvem NÃO estão implementados. Testes no celular ainda pendentes. Não excluir sem fazer backup." \
            --prerelease --latest=false
