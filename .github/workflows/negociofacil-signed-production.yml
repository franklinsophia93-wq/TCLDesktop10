name: NegocioFacil 0.6 - assinatura permanente e login nativo seguro
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-signed:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout do codigo de NegocioFacil
        uses: actions/checkout@v4
      - name: Descompactar e aplicar revisoes ate 0.6
        shell: bash
        run: |
          set -euo pipefail
          test -f negociofacil/NegocioFacil-src.zip
          test -f negociofacil/upgrade_v03.py
          mkdir build-src
          unzip -q negociofacil/NegocioFacil-src.zip -d build-src
          python3 negociofacil/upgrade_v03.py build-src
          python3 negociofacil/upgrade_v04_admob.py build-src
          python3 negociofacil/upgrade_v05_sharing.py build-src
          python3 negociofacil/upgrade_v06_login.py build-src negociofacil
          node --check build-src/web/app.js
          grep -Fq 'AndroidKeyStore' build-src/android/app/src/main/java/br/com/negociofacil/app/CloudAccount.java
          grep -Fq 'cloudConnectMP' build-src/web/app.js
          node --check build-src/web/app.js
          grep -q "versionCode 6" build-src/android/app/build.gradle
          grep -q "applicationId 'br.com.negociofacil.app'" build-src/android/app/build.gradle
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK release SEM assinatura
        shell: bash
        run: |
          set -euo pipefail
          gradle -p build-src/android --no-daemon --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=512m" :app:assembleRelease
          test -s build-src/android/app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Aplicar chave PERMANENTE do cofre GitHub Secrets
        shell: bash
        env:
          NF_KEYSTORE_B64: ${{ secrets.NF_KEYSTORE_B64 }}
          NF_KEYSTORE_PASSWORD: ${{ secrets.NF_KEYSTORE_PASSWORD }}
          NF_KEY_ALIAS: ${{ secrets.NF_KEY_ALIAS }}
          NF_KEY_PASSWORD: ${{ secrets.NF_KEY_PASSWORD }}
          NF_SIGNING_CERT_SHA256: ${{ vars.NF_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in NF_KEYSTORE_B64 NF_KEYSTORE_PASSWORD NF_KEY_ALIAS NF_KEY_PASSWORD; do
            if test -z "${!name:-}"; then
              echo "::error::Chave permanente nao configurada: GitHub Actions Secret $name."
              exit 1
            fi
          done
          umask 077
          KS="$RUNNER_TEMP/negociofacil-permanente.jks"
          ALIGNED="$RUNNER_TEMP/negociofacil-aligned.apk"
          trap 'rm -f "$KS" "$ALIGNED"' EXIT
          printf '%s' "$NF_KEYSTORE_B64" | base64 --decode > "$KS"
          test -s "$KS"
          APK_UNSIGNED=build-src/android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$APK_UNSIGNED" "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$KS" \
            --ks-key-alias "$NF_KEY_ALIAS" \
            --ks-pass env:NF_KEYSTORE_PASSWORD \
            --key-pass env:NF_KEY_PASSWORD \
            --out NegocioFacil-0.6-assinado.apk "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs NegocioFacil-0.6-assinado.apk > assinatura.txt
          DIGEST="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' assinatura.txt | head -n1)"
          if test -z "$DIGEST"; then
            echo "::error::Assinatura nao foi validada"; exit 1
          fi
          printf '%s\n' "$DIGEST" > certificado-sha256.txt
          if test -n "${NF_SIGNING_CERT_SHA256:-}"; then
            if test "${DIGEST,,}" != "${NF_SIGNING_CERT_SHA256,,}"; then
              echo "::error::Certificado DIFERENTE do permanente. Publicacao bloqueada."; exit 1
            fi
            echo "Certificado permanente corresponde ao fingerprint aprovado."
          else
            echo "::notice::Primeira assinatura: configure NF_SIGNING_CERT_SHA256 nas Variables do repositorio com o fingerprint publicado em certificado-sha256.txt."
          fi
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging NegocioFacil-0.6-assinado.apk | grep -Fq "package: name='br.com.negociofacil.app'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging NegocioFacil-0.6-assinado.apk | grep -Fq "versionCode='6'"
          unzip -tqq NegocioFacil-0.6-assinado.apk
          sha256sum NegocioFacil-0.6-assinado.apk
          echo "APK release assinado, alinhado e validado; nunca distribuir assinatura DEBUG para quem instalou release."
      - name: Publicar artifact apenas apos assinatura verificada
        uses: actions/upload-artifact@v4
        with:
          name: NegocioFacil-0.6-ASSINADO-com-chave-permanente
          path: |
            NegocioFacil-0.6-assinado.apk
            assinatura.txt
            certificado-sha256.txt
          if-no-files-found: error
